name: CI/DI

on:
  push:
    branches: ["main"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 -m py_compile function_app.py
      - run: pip install ruff black isort
      - run: ruff check function_app.py
      - run: black --check function_app.py
